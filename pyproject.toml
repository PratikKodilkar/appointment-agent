[project]
name = "appointment-scheduling-agent"
version = "0.0.1"
description = "A modular and AI-powered appointment booking agent designed to streamline scheduling for businesses"
authors = [
    { name = "Pratik Kodilkar"},
]
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.6",
    "langchain-openai>=0.1.22",
    "langchain-google-genai>=2.0.8",
    "langchain>=0.2.14",
    "python-dotenv>=1.0.1",
    "langchain-community>=0.2.17",
    "tavily-python>=0.4.0",
    "requests>=2.32.3",
    "types-requests>=2.32.0.20241016",
    "langchain-groq>=0.2.1",
    "composio-langgraph>=0.6.19",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["react_agent", "appointment_agent"]
[tool.setuptools.package-dir]
"react_agent" = "src/react_agent"
"appointment_agent" = "src/appointment_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
